<script>
const ADMIN_LOGIN_KEY = "paid_leave_admin_login";

function getAdminSessionToken_() {
  const stored = sessionStorage.getItem(ADMIN_LOGIN_KEY);
  if (!stored) return "";
  try { return String((JSON.parse(stored) || {}).token || ""); } catch (err) { return ""; }
}

function clearAdminSession_() {
  sessionStorage.removeItem(ADMIN_LOGIN_KEY);
  if (typeof currentAdminUser !== "undefined") currentAdminUser = null;
}

function handleAdminApiFailure_(err) {
  console.error("管理者APIエラー:", err);
  const message = String(err && err.message || "");
  if (/^ADMIN_SESSION_(REQUIRED|EXPIRED|INVALID)$/.test(message)) {
    clearAdminSession_();
    showLoginScreen();
    setLoginMessage_("セッションの有効期限が切れました。もう一度ログインしてください。");
    loadAdminUsersForLogin();
    return true;
  }
  return false;
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDisplayDate(value) {
  if (!value) return "";
  return String(value).replace(/-/g, "/");
}

function showLoading(targetId, text) {
  const el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = `
    <div class="state-message loading-state">
      <div class="state-title">${escapeHtml(text || "読み込み中...")}</div>
      <div class="state-sub">少しお待ちください。</div>
    </div>
  `;
}

function showError(targetId, text) {
  const el = document.getElementById(targetId);
  if (!el) return;
  el.innerHTML = `
    <div class="state-message error-state">
      <div class="state-title">${escapeHtml(text || "エラーが発生しました")}</div>
      <div class="state-sub">時間をおいて再度お試しください。</div>
    </div>
  `;
}

function getPagedRows(response) {
  if (Array.isArray(response)) return response;
  return Array.isArray(response && response.rows) ? response.rows : [];
}
</script>
