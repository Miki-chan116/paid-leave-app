<script>
let adminEmployees = [];
let editingEmployeeId = "";
let retiringEmployeeId = "";
let retirementRecordEmployeeId = "";
let retirementRecordPreview = null;

function getDisplayName(emp) {
  return String((emp && (emp.display_name || emp.name)) || "").trim();
}

/* =========================
   初期表示
========================= */
window.addEventListener("DOMContentLoaded", () => {
  initializeWorkTimeSelects();
  loadEmployees();
});

/* =========================
   社員別勤務時間入力
========================= */
function initializeWorkTimeSelects() {
  document.querySelectorAll("select[data-work-time-select]").forEach(select => {
    const currentValue = String(select.value || "");
    select.innerHTML = "";

    const standardOption = document.createElement("option");
    standardOption.value = "";
    standardOption.textContent = "会社標準を使用";
    select.appendChild(standardOption);

    // 勤務パターンを07:00〜16:00へ限定せず、1日の全時刻を30分単位で選べるようにする。
    for (let minute = 0; minute < 24 * 60; minute += 30) {
      const option = document.createElement("option");
      option.value = minuteToTimeInput(minute);
      option.textContent = option.value;
      select.appendChild(option);
    }

    select.value = currentValue;
  });
}

function getWorkSchedulePairError(startValue, endValue) {
  const hasStart = !!String(startValue || "").trim();
  const hasEnd = !!String(endValue || "").trim();
  if (hasStart !== hasEnd) return "勤務開始時刻と勤務終了時刻は両方設定してください。";

  const startMinute = timeInputToMinute(startValue);
  const endMinute = timeInputToMinute(endValue);
  if (startMinute !== "" && Number(endMinute) <= Number(startMinute)) {
    return "勤務終了時刻は勤務開始時刻より後にしてください。";
  }
  return "";
}

function handleWorkScheduleTimeChange(startId, endId, statusId) {
  const start = document.getElementById(startId);
  const end = document.getElementById(endId);
  const error = getWorkSchedulePairError(start && start.value, end && end.value);
  [start, end].forEach(element => {
    if (element && typeof element.setCustomValidity === "function") element.setCustomValidity(error);
  });
  if (!error) return;

  if (statusId === "editEmployeeStatus") showEditStatus(error, "error");
  else showStatus(error, "error");
}

/* =========================
   社員取得
========================= */
function loadEmployees() {
  google.script.run
    .withSuccessHandler(data => {
      adminEmployees = data || [];

      if (
        getValue("employeeSearchKeyword") ||
        getValue("filterEmploymentStatus") ||
        getValue("filterEmploymentType")
      ) {
        handleEmployeeSearchInput();
      } else {
        const list = document.getElementById("employeeList");
        if (list) list.innerHTML = "";
        updateEmployeeResultSummary(0, "", false);
        showStatus("検索条件を入力すると、ここに結果が表示されます。", "");
      }
    })
    .withFailureHandler(err => {
      console.error(err);
      showStatus("社員取得エラー\n" + (err.message || err), "error");
    })
    .getEmployeesForAdmin();
}

/* =========================
   検索・フィルター
========================= */
function handleEmployeeSearchInput() {
  const keyword = getValue("employeeSearchKeyword").toLowerCase();
  const statusFilter = getValue("filterEmploymentStatus");
  const typeFilter = getValue("filterEmploymentType");
  const list = document.getElementById("employeeList");

  if (!list) return;

  if (!keyword && !statusFilter && !typeFilter) {
    list.innerHTML = "";
    updateEmployeeResultSummary(0, "", false);
    showStatus("検索条件を入力すると、ここに結果が表示されます。", "");
    return;
  }

  const filtered = adminEmployees.filter(emp => {
    const target = [
      emp.employee_id,
      emp.display_employee_id,
      emp.name,
      emp.display_name,
      emp.name_kana,
      emp.company_name,
      emp.department,
      emp.employment_type,
      emp.employment_status
    ].join(" ").toLowerCase();

    const keywordMatch = !keyword || target.includes(keyword);
    const statusMatch = !statusFilter || emp.employment_status === statusFilter;
    const typeMatch = !typeFilter || emp.employment_type === typeFilter;

    return keywordMatch && statusMatch && typeMatch;
  });

  renderEmployeeList(filtered);
  updateEmployeeResultSummary(filtered.length, getCurrentSearchConditionText(), true);

  showStatus(
    filtered.length > 0
      ? `検索結果一覧（${filtered.length}件）`
      : "該当する社員はいません。",
    filtered.length > 0 ? "ok" : ""
  );
}

/* =========================
   一覧表示
========================= */
function renderEmployeeList(data) {
  const list = document.getElementById("employeeList");
  if (!list) return;

  list.innerHTML = "";

  if (!data || data.length === 0) {
    list.innerHTML = `<div class="employee-search-placeholder">該当なし</div>`;
    return;
  }

  data.forEach(emp => {
    const row = document.createElement("div");
    row.className = "admin-employee-row";
    row.dataset.employeeId = emp.employee_id || "";

    if (emp.employment_status === "retired") {
      row.classList.add("retired");
    }

      row.innerHTML = `
      <div class="admin-employee-main">
        <div class="admin-employee-name-line">
          <button type="button" class="admin-employee-name-link" data-action="edit" data-employee-id="${escapeHtml(emp.employee_id || "")}">
            ${escapeHtml(getDisplayName(emp))}
          </button>
          <span class="employee-badge status-${escapeHtml(emp.employment_status || "unknown")}">
            ${escapeHtml(getEmploymentStatusLabel(emp.employment_status))}
          </span>
          <span class="employee-badge ${emp.leave_management_target === true ? "leave-target" : "leave-excluded"}">
            ${escapeHtml(getLeaveManagementTargetLabel(emp.leave_management_target))}
          </span>
          <span class="employee-badge company-${escapeHtml(String(emp.company_code || "main").toLowerCase())}">
            ${escapeHtml(getCompanyCodeLabel(emp.company_code))}
          </span>
        </div>

        <div class="admin-employee-meta">
          ${escapeHtml(emp.name_kana || "")}
          ／ ${escapeHtml(emp.display_employee_id || "")}
          ／ ${escapeHtml(emp.employee_id || "")}
          ／ ${escapeHtml(getEmploymentTypeLabel(emp.employment_type))}
          ${emp.company_name ? "／ " + escapeHtml(emp.company_name) : ""}
          ${emp.department ? "／ " + escapeHtml(emp.department) : ""}
        </div>
      </div>

      <div class="admin-employee-actions">
        <button type="button" class="admin-action-btn edit-btn" data-action="edit" data-employee-id="${escapeHtml(emp.employee_id || "")}">✏️ 編集</button>
        <button type="button" class="admin-action-btn retire-btn" data-action="retire" data-employee-id="${escapeHtml(emp.employee_id || "")}">⚠️ 退職</button>
        ${emp.employment_status === "retired"
          ? `<button type="button" class="admin-action-btn" data-action="retirement-record" data-employee-id="${escapeHtml(emp.employee_id || "")}">🧾 退職時有給を記録</button>`
          : ""}
      </div>
    `;

    list.appendChild(row);
  });
}

document.addEventListener("click", event => {
  const button = event.target.closest("[data-action][data-employee-id]");
  if (!button) return;

  const employeeId = button.dataset.employeeId || "";
  const emp = adminEmployees.find(item => String(item.employee_id || "") === employeeId);
  if (!emp) return;

  event.preventDefault();

  if (button.dataset.action === "edit") {
    openEditEmployeeModal(emp);
  }

  if (button.dataset.action === "retire") {
    openRetireModal(emp);
  }

  if (button.dataset.action === "retirement-record") {
    openRetirementLeaveRecordModal(emp);
  }
});

/* =========================
   退職時有給記録（Phase 1: 後追い登録）
========================= */
function openRetirementLeaveRecordModal(emp) {
  retirementRecordEmployeeId = emp.employee_id || "";
  retirementRecordPreview = null;
  setValue("retirementLeaveRecordSubTitle", "");
  document.getElementById("retirementLeaveRecordSubTitle").textContent =
    `${getDisplayName(emp)}（${emp.display_employee_id || emp.employee_id || ""}）`;
  document.getElementById("retirementLeaveRecordLoading").style.display = "block";
  document.getElementById("retirementLeaveRecordForm").style.display = "none";
  document.getElementById("retirementLeaveRecordExisting").style.display = "none";
  document.getElementById("createRetirementLeaveRecordBtn").disabled = false;
  document.getElementById("createRetirementLeaveRecordBtn").style.display = "none";
  document.getElementById("retirementLotDetails").style.display = "none";
  setRetirementLeaveRecordStatus("", "");
  document.getElementById("retirementLeaveRecordModal").style.display = "flex";

  google.script.run
    .withSuccessHandler(result => {
      document.getElementById("retirementLeaveRecordLoading").style.display = "none";
      retirementRecordPreview = result || null;
      const existing = result && result.existing_record;
      if (existing) {
        document.getElementById("retirementLeaveRecordExisting").style.display = "block";
        document.getElementById("retirementLeaveRecordExistingDetail").textContent =
          `登録済み（退職日: ${formatRetirementDate(existing.leave_date)}、FIFO残高: ${formatRetirementDays(existing.balance_as_of_leave_date)}日、調整: ${formatRetirementDays(existing.adjustment_days)}日、調整後: ${formatRetirementDays(existing.balance_after_adjustment)}日、登録日: ${formatRetirementDate(existing.created_at)}）`;
        return;
      }

      setValue("retirementRecordLeaveDate", toInputDate(result.employee.leave_date));
      setValue("retirementRecordFifoBalance", `${formatRetirementDays(result.balance.current_remaining_days)}日`);
      setValue("retirementAdjustmentMode", "record_only");
      setValue("retirementAdjustmentReason", "retirement_settlement");
      setValue("retirementAdjustmentNotes", "");
      renderRetirementLotDetails(result.balance.grant_details || []);
      document.getElementById("retirementLeaveRecordForm").style.display = "block";
      document.getElementById("createRetirementLeaveRecordBtn").style.display = "inline-block";
      syncRetirementAdjustmentFields();
    })
    .withFailureHandler(err => {
      document.getElementById("retirementLeaveRecordLoading").style.display = "none";
      setRetirementLeaveRecordStatus("退職日時点の残高を取得できませんでした。\n" + (err.message || err), "error");
    })
    .getRetirementLeaveBalancePreview(retirementRecordEmployeeId);
}

function closeRetirementLeaveRecordModal() {
  retirementRecordEmployeeId = "";
  retirementRecordPreview = null;
  document.getElementById("retirementLeaveRecordModal").style.display = "none";
}

function syncRetirementAdjustmentFields() {
  if (!retirementRecordPreview || !retirementRecordPreview.balance) return;
  const balance = Number(retirementRecordPreview.balance.current_remaining_days || 0);
  const mode = getValue("retirementAdjustmentMode");
  const input = document.getElementById("retirementAdjustmentDays");
  let adjustment = 0;

  if (mode === "zero_out") {
    adjustment = -balance;
    input.readOnly = true;
  } else if (mode === "manual") {
    if (input.readOnly) input.value = "0";
    input.readOnly = false;
    adjustment = Number(input.value || 0);
  } else {
    input.readOnly = true;
  }

  if (mode !== "manual") input.value = adjustment;
  const after = balance + adjustment;
  setValue("retirementBalanceAfterAdjustment", `${formatRetirementDays(Math.max(0, after))}日`);
  if (adjustment > 0 || after < 0) {
    setRetirementLeaveRecordStatus("調整日数は0以下で、調整後管理残高は0日以上にしてください。", "error");
  } else {
    setRetirementLeaveRecordStatus("", "");
  }
}

function toggleRetirementLotDetails() {
  const area = document.getElementById("retirementLotDetails");
  area.style.display = area.style.display === "none" ? "block" : "none";
}

function renderRetirementLotDetails(lots) {
  const area = document.getElementById("retirementLotDetails");
  if (!lots.length) {
    area.textContent = "対象となる付与ロットはありません。";
    return;
  }
  area.innerHTML = lots.map(lot =>
    `${escapeHtml(lot.grant_date || "")} / 期限 ${escapeHtml(lot.valid_to || "")} / 付与 ${escapeHtml(formatRetirementDays(lot.total_days))}日 / 使用 ${escapeHtml(formatRetirementDays(lot.used_days))}日 / 残 ${escapeHtml(formatRetirementDays(lot.active_remaining_days))}日${lot.is_expired ? "（期限切れ）" : ""}`
  ).join("<br>");
}

function submitRetirementLeaveRecord() {
  if (!retirementRecordPreview || !retirementRecordEmployeeId) return;
  const mode = getValue("retirementAdjustmentMode");
  const balance = Number(retirementRecordPreview.balance.current_remaining_days || 0);
  const adjustment = mode === "zero_out" ? -balance : Number(getValue("retirementAdjustmentDays") || 0);
  const after = balance + adjustment;
  if (adjustment > 0 || after < 0) {
    setRetirementLeaveRecordStatus("調整日数または調整後管理残高が不正です。", "error");
    return;
  }

  const reason = getValue("retirementAdjustmentReason");
  const message = [
    `退職日: ${formatRetirementDate(retirementRecordPreview.employee.leave_date)}`,
    `退職日時点残高: ${formatRetirementDays(balance)}日`,
    `退職時調整: ${formatRetirementDays(adjustment)}日`,
    `調整後残高: ${formatRetirementDays(after)}日`,
    `理由: ${getRetirementReasonLabel(reason)}`
  ].join("\n");
  if (!confirm(message + "\n\nこの内容で記録しますか？")) return;

  document.getElementById("createRetirementLeaveRecordBtn").disabled = true;
  setRetirementLeaveRecordStatus("退職時有給記録を保存しています...", "");
  google.script.run
    .withSuccessHandler(() => {
      setRetirementLeaveRecordStatus("退職時有給記録を保存しました。", "ok");
      document.getElementById("createRetirementLeaveRecordBtn").style.display = "none";
      loadEmployees();
    })
    .withFailureHandler(err => {
      document.getElementById("createRetirementLeaveRecordBtn").disabled = false;
      setRetirementLeaveRecordStatus("保存できませんでした。\n" + (err.message || err), "error");
    })
    .createRetirementLeaveRecordForRetiredEmployee({
      employee_id: retirementRecordEmployeeId,
      adjustment_mode: mode,
      adjustment_days: adjustment,
      reason: reason,
      notes: getValue("retirementAdjustmentNotes")
    });
}

function setRetirementLeaveRecordStatus(message, type) {
  const box = document.getElementById("retirementLeaveRecordStatus");
  if (!box) return;
  box.style.display = message ? "block" : "none";
  box.classList.remove("ok", "error");
  if (type) box.classList.add(type);
  box.textContent = message || "";
}

function formatRetirementDays(value) {
  const num = Number(value || 0);
  return Number.isInteger(num) ? String(num) : String(num);
}

function formatRetirementDate(value) {
  const inputDate = toInputDate(value);
  return inputDate ? inputDate.replace(/-/g, "/") : "";
}

function getRetirementReasonLabel(reason) {
  const labels = {
    retirement_settlement: "退職時精算",
    company_adjustment: "会社都合による調整",
    data_correction: "データ補正",
    other: "その他"
  };
  return labels[reason] || reason;
}

/* =========================
   編集モーダルを開く
========================= */
function openEditEmployeeModal(emp) {
  editingEmployeeId = emp.employee_id || "";

  setValue("editName", emp.name);
  setValue("editDisplayName", emp.display_name);
  setValue("editNameKana", emp.name_kana);
  setValue("editCompanyCode", emp.company_code || "MAIN");
  setValue("editCompanyName", emp.company_name);
  ensureDepartmentOption("editDepartment", emp.department);
  setValue("editDepartment", emp.department);
  setValue("editEmploymentType", emp.employment_type);
  setValue("editEmploymentStatus", emp.employment_status || "active");
  setValue("editHireDate", toInputDate(emp.hire_date));
  setValue("editLeaveDate", toInputDate(emp.leave_date));
  setValue("editWorkDaysPerWeek", emp.work_days_per_week);
  setValue("editWorkStartTime", minuteToTimeInput(emp.work_start_minute));
  setValue("editWorkEndTime", minuteToTimeInput(emp.work_end_minute));
  setValue("editFiscalStartMonth", emp.fiscal_start_month || "4");
  setValue("editLeaveManagementTarget", emp.leave_management_target === true ? "TRUE" : "FALSE");
  setValue("editIsDriver", emp.is_driver === true ? "TRUE" : "FALSE");
  ensureTemporarySelectOption("editDriverType", emp.driver_type);
  setValue("editDriverType", emp.driver_type || "");
  setValue("editDefaultVehicleId", emp.default_vehicle_id || "");
  setValue("editNotes", emp.notes);
  syncFiscalStartMonthWithCompanyCode("editCompanyCode", "editFiscalStartMonth");

  const subTitle = document.getElementById("editEmployeeSubTitle");
  if (subTitle) {
    subTitle.textContent = `${getDisplayName(emp)} ／ ${emp.display_employee_id || ""} ／ ${emp.employee_id || ""}`;
  }

  showEditStatus("内容を確認して保存してください。", "");

  const modal = document.getElementById("editEmployeeModal");
  if (modal) modal.style.display = "flex";
}

/* =========================
   編集モーダルを閉じる
========================= */
function closeEditEmployeeModal() {
  editingEmployeeId = "";

  const modal = document.getElementById("editEmployeeModal");
  if (modal) modal.style.display = "none";
}

/* =========================
   編集保存
========================= */
function submitEditEmployee() {
  const payload = {
    employee_id: editingEmployeeId,
    name: getValue("editName"),
    display_name: getValue("editDisplayName"),
    name_kana: getValue("editNameKana"),
    company_code: getValue("editCompanyCode"),
    company_name: getValue("editCompanyName"),
    department: getValue("editDepartment"),
    employment_type: getValue("editEmploymentType"),
    employment_status: getValue("editEmploymentStatus"),
    hire_date: getValue("editHireDate"),
    leave_date: getValue("editLeaveDate"),
    work_days_per_week: getValue("editWorkDaysPerWeek"),
    work_start_minute: timeInputToMinute(getValue("editWorkStartTime")),
    work_end_minute: timeInputToMinute(getValue("editWorkEndTime")),
    fiscal_start_month: getValue("editFiscalStartMonth"),
    leave_management_target: getValue("editLeaveManagementTarget"),
    is_driver: getValue("editIsDriver"),
    driver_type: getValue("editDriverType"),
    default_vehicle_id: getValue("editDefaultVehicleId"),
    notes: getValue("editNotes")
  };

  const error = validateEmployeePayload(payload);
  if (error) {
    showEditStatus(error, "error");
    return;
  }

  showEditStatus("社員情報を更新しています...", "");

  google.script.run
    .withSuccessHandler(() => {
      showEditStatus("社員情報を更新しました。", "ok");
      loadEmployees();

      setTimeout(() => {
        closeEditEmployeeModal();
      }, 500);
    })
    .withFailureHandler(err => {
      console.error(err);
      showEditStatus("更新でエラーが発生しました。\n" + (err.message || err), "error");
    })
    .updateEmployeeFromAdmin(payload);
}

/* =========================
   退職モーダルを開く
========================= */
function openRetireModal(emp) {
  retiringEmployeeId = emp.employee_id || "";

  const subTitle = document.getElementById("retireEmployeeSubTitle");
  if (subTitle) {
    subTitle.textContent = `${getDisplayName(emp)}（${emp.display_employee_id || emp.employee_id || ""}）`;
  }

  setValue("retireDate", "");

  showRetireStatus("退職日を入力してください。", "");

  const modal = document.getElementById("retireEmployeeModal");
  if (modal) modal.style.display = "flex";
}

/* =========================
   退職モーダルを閉じる
========================= */
function closeRetireModal() {
  retiringEmployeeId = "";

  const modal = document.getElementById("retireEmployeeModal");
  if (modal) modal.style.display = "none";
}

/* =========================
   退職実行
========================= */
function submitRetire() {
  const leaveDate = getValue("retireDate");

  if (!retiringEmployeeId) {
    showRetireStatus("退職対象がありません。", "error");
    return;
  }

  if (!leaveDate) {
    showRetireStatus("退職日を入力してください。", "error");
    return;
  }

  showRetireStatus("退職処理を実行しています...", "");

  google.script.run
    .withSuccessHandler(() => {
      showRetireStatus("退職処理を完了しました。", "ok");
      loadEmployees();

      setTimeout(() => {
        closeRetireModal();
      }, 500);
    })
    .withFailureHandler(err => {
      console.error(err);
      showRetireStatus("退職処理でエラーが発生しました。\n" + (err.message || err), "error");
    })
    .retireEmployeeFromAdmin(retiringEmployeeId, leaveDate);
}

/* =========================
   社員マスター整備
========================= */
function runMaintain() {
  showStatus("社員マスターを整備しています...", "");

  google.script.run
    .withSuccessHandler(result => {
      showStatus((result && result.message) || "社員マスターを整備しました。", "ok");
      loadEmployees();
    })
    .withFailureHandler(err => {
      console.error(err);
      showStatus("社員マスター整備でエラーが発生しました。\n" + (err.message || err), "error");
    })
    .runMaintainEmployeeMasterFromAdmin();
}

/* =========================
   社員追加フォーム開閉
========================= */
function toggleAddEmployeeForm() {
  const area = document.getElementById("addEmployeeFormArea");
  const btn = document.getElementById("toggleAddEmployeeBtn");

  if (!area || !btn) return;

  const isOpen = area.style.display !== "none";

  if (isOpen) {
    area.style.display = "none";
    btn.textContent = "＋ 新しい社員を追加する";
    clearForm();
  } else {
    area.style.display = "block";
    btn.textContent = "− 追加フォームを閉じる";
  }
}

/* =========================
   社員追加
========================= */
function submitEmployee() {
  const btn = document.getElementById("addEmployeeBtn");

  const payload = {
    name: getValue("name"),
    display_name: getValue("displayName"),
    name_kana: getValue("nameKana"),
    company_code: getValue("companyCode"),
    company_name: getValue("companyName"),
    department: getValue("department"),
    employment_type: getValue("employmentType"),
    employment_status: getValue("employmentStatus"),
    hire_date: getValue("hireDate"),
    leave_date: getValue("leaveDate"),
    work_days_per_week: getValue("workDaysPerWeek"),
    work_start_minute: timeInputToMinute(getValue("workStartTime")),
    work_end_minute: timeInputToMinute(getValue("workEndTime")),
    fiscal_start_month: getValue("fiscalStartMonth"),
    leave_management_target: getValue("leaveManagementTarget"),
    is_driver: getValue("isDriver"),
    driver_type: getValue("driverType"),
    default_vehicle_id: getValue("defaultVehicleId"),
    notes: getValue("notes")
  };

  const error = validateEmployeePayload(payload);
  if (error) {
    showStatus(error, "error");
    return;
  }

  if (btn) {
    btn.disabled = true;
    btn.textContent = "追加中...";
  }

  showStatus("社員情報を追加しています...", "");

  google.script.run
    .withSuccessHandler(() => {
      showStatus("社員を追加しました。", "ok");
      clearForm();
      loadEmployees();

      if (btn) {
        btn.disabled = false;
        btn.textContent = "社員を追加する";
      }
    })
    .withFailureHandler(err => {
      console.error(err);
      showStatus("追加でエラーが発生しました。\n" + (err.message || err), "error");

      if (btn) {
        btn.disabled = false;
        btn.textContent = "社員を追加する";
      }
    })
    .addEmployeeFromAdmin(payload);
}

/* =========================
   バリデーション
========================= */
function timeInputToMinute(value) {
  const text = String(value || "").trim();
  if (!text) return "";
  const match = text.match(/^([01][0-9]|2[0-3]):([0-5][0-9])$/);
  if (!match) return "";
  return Number(match[1]) * 60 + Number(match[2]);
}

function minuteToTimeInput(value) {
  if (value === "" || value === null || value === undefined) return "";
  const minute = Number(value);
  if (!Number.isInteger(minute) || minute < 0 || minute >= 24 * 60) return "";
  return String(Math.floor(minute / 60)).padStart(2, "0") + ":" +
    String(minute % 60).padStart(2, "0");
}

function validateEmployeePayload(payload) {
  if (!payload.name) return "氏名を入力してください。";
  if (!payload.name_kana) return "ふりがなを入力してください。";
  if (!payload.company_code) return "会社区分を選択してください。";
  if (!payload.employment_type) return "雇用区分を選択してください。";
  if (!payload.employment_status) return "在職状況を選択してください。";

  if (payload.employment_status === "retired" && !payload.leave_date) {
    return "退職の場合は退職日を入力してください。";
  }

  if (payload.employment_status === "active" && payload.leave_date) {
    return "在職中の場合は退職日を空欄にしてください。";
  }

  const workScheduleError = getWorkSchedulePairError(
    payload.work_start_minute === "" ? "" : minuteToTimeInput(payload.work_start_minute),
    payload.work_end_minute === "" ? "" : minuteToTimeInput(payload.work_end_minute)
  );
  if (workScheduleError) return workScheduleError;

  return "";
}

/* =========================
   会社選択連動
========================= */
function handleCompanyCodeChange() {
  const companyCode = document.getElementById("companyCode").value;
  const employmentType = document.getElementById("employmentType");
  const leaveManagementTarget = document.getElementById("leaveManagementTarget");

  if (companyCode === "PARTNER") {
    employmentType.value = "partner";
    leaveManagementTarget.value = "FALSE";
  }

  if (companyCode === "MAIN" && employmentType.value === "partner") {
    employmentType.value = "regular";
  }

  syncFiscalStartMonthWithCompanyCode("companyCode", "fiscalStartMonth");
}

function handleEditCompanyCodeChange() {
  syncFiscalStartMonthWithCompanyCode("editCompanyCode", "editFiscalStartMonth");
}

function syncFiscalStartMonthWithCompanyCode(companySelectId, fiscalStartSelectId) {
  const companyCode = getValue(companySelectId);
  if (companyCode === "PARTNER") {
    setValue(fiscalStartSelectId, "6");
    return;
  }

  if (companyCode === "MAIN") {
    setValue(fiscalStartSelectId, "4");
  }
}

/* =========================
   ラベル変換
========================= */
function getEmploymentTypeLabel(type) {
  if (type === "regular") return "正社員";
  if (type === "partner") return "協力企業";
  if (type === "trainee") return "研修生";
  if (type === "part_time") return "パート";
  if (type === "executive") return "役員";
  if (type === "other") return "その他";
  return type || "";
}

function getEmploymentStatusLabel(status) {
  if (status === "active") return "在職";
  if (status === "leave") return "休職";
  if (status === "retired") return "退職";
  return status || "";
}

function getLeaveManagementTargetLabel(value) {
  return value === true ? "有給対象" : "有給対象外";
}

function getCompanyCodeLabel(companyCode) {
  const code = String(companyCode || "").trim().toUpperCase();
  if (code === "PARTNER") return "PARTNER";
  if (code === "MAIN") return "MAIN";
  return code || "MAIN";
}

function ensureDepartmentOption(selectId, department) {
  ensureTemporarySelectOption(selectId, department);
}

function ensureTemporarySelectOption(selectId, value) {
  const select = document.getElementById(selectId);
  const normalizedValue = String(value || "").trim();

  if (!select) return;

  Array.from(select.querySelectorAll("option[data-temporary='true']")).forEach(option => {
    option.remove();
  });

  if (!normalizedValue) return;

  const exists = Array.from(select.options).some(option => option.value === normalizedValue);
  if (exists) return;

  const option = document.createElement("option");
  option.value = normalizedValue;
  option.textContent = normalizedValue;
  option.dataset.temporary = "true";
  select.appendChild(option);
}

function getCurrentSearchConditionText() {
  const parts = [];
  const keyword = getValue("employeeSearchKeyword");
  const status = getValue("filterEmploymentStatus");
  const type = getValue("filterEmploymentType");

  if (keyword) parts.push(`キーワード: ${keyword}`);
  if (status) parts.push(`在職状況: ${getEmploymentStatusLabel(status)}`);
  if (type) parts.push(`雇用区分: ${getEmploymentTypeLabel(type)}`);

  return parts.length > 0 ? parts.join(" / ") : "条件なし";
}

function updateEmployeeResultSummary(count, conditionText, visible) {
  const summary = document.getElementById("employeeResultSummary");
  if (!summary) return;

  if (!visible) {
    summary.style.display = "none";
    summary.textContent = "";
    return;
  }

  summary.style.display = "flex";
  summary.innerHTML = `
    <span class="employee-result-count">${escapeHtml(count)}件</span>
    <span class="employee-result-condition">${escapeHtml(conditionText || "条件なし")}</span>
  `;
}

/* =========================
   共通
========================= */
function getValue(id) {
  const el = document.getElementById(id);
  return el ? String(el.value || "").trim() : "";
}

function setValue(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = value == null ? "" : String(value);
}

function showStatus(message, type) {
  const box = document.getElementById("employeeAdminStatus");
  if (!box) return;

  box.classList.remove("ok", "error");
  if (type) box.classList.add(type);

  box.textContent = message || "検索条件を入力すると、ここに結果が表示されます。";
}

function showEditStatus(message, type) {
  const box = document.getElementById("editEmployeeStatus");
  if (!box) return;

  box.classList.remove("ok", "error");
  if (type) box.classList.add(type);

  box.textContent = message;
}

function showRetireStatus(message, type) {
  const box = document.getElementById("retireStatus");
  if (!box) return;

  box.classList.remove("ok", "error");
  if (type) box.classList.add(type);

  box.textContent = message;
}

function clearForm() {
  setValue("name", "");
  setValue("displayName", "");
  setValue("nameKana", "");
  setValue("companyCode", "MAIN");
  setValue("companyName", "");
  setValue("department", "");
  setValue("employmentType", "");
  setValue("employmentStatus", "active");
  setValue("hireDate", "");
  setValue("leaveDate", "");
  setValue("workDaysPerWeek", "");
  setValue("workStartTime", "");
  setValue("workEndTime", "");
  setValue("fiscalStartMonth", "4");
  setValue("leaveManagementTarget", "TRUE");
  setValue("isDriver", "FALSE");
  setValue("driverType", "");
  setValue("defaultVehicleId", "");
  setValue("notes", "");
}

function toInputDate(value) {
  if (!value) return "";

  const str = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  if (/^\d{4}\/\d{2}\/\d{2}$/.test(str)) return str.replace(/\//g, "-");

  return "";
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
